[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retrore"
version = "1.1.0"
description = "Reverse-engineering tools for DOS, AmigaDOS, Atari, Commodore 64, Apple II, MSX2, NEC, Sharp, Classic Macintosh, NES, and Sega Genesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["capstone>=5,<6", "unicorn>=2.1,<3", "py65>=1.2,<2", "z80>=1.2,<2"]

[project.scripts]
retrore = "retrore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrore = ["ghidra_scripts/*.java"]
